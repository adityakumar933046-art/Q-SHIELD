version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qshield-postgres
    restart: always
    environment:
      POSTGRES_DB: qshield
      POSTGRES_USER: qshield_user
      POSTGRES_PASSWORD: qshield_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qshield_user -d qshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qshield-internal

  redis:
    image: redis:7-alpine
    container_name: qshield-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qshield-internal

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: qshield-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://qshield_user:qshield_secure_password@postgres:5432/qshield
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: production_secure_random_key_qshield_2026
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qshield-internal

  nginx:
    image: nginx:alpine
    container_name: qshield-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - qshield-internal

volumes:
  postgres_data:
  redis_data:

networks:
  qshield-internal:
    driver: bridge
